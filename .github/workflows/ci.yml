name: CI

on:
  push:
  pull_request:

jobs:
  ios:
    name: iOS Build & Test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Select a recent, stable Xcode without hardcoding a path
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Capture Xcode version for cache keying
      - name: Detect Xcode version
        id: xcode
        run: |
          set -euo pipefail
          ver=$(xcodebuild -version | sed -n 's/^Xcode //p' | head -n1)
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      # Helpful for diagnostics
      - name: Show Xcode and SDKs
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks || true

      # Cache Swift Package Manager artifacts to speed up builds
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
            .build/SourcePackages
          key: ${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-spm-${{ hashFiles('**/Package.resolved', '**/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-spm-

      # Ensure xcbeautify is available for Makefile piping
      - name: Install xcbeautify
        run: |
          set -euo pipefail
          brew install xcbeautify

      # Install jq for robust JSON parsing of simctl output
      - name: Install jq
        run: |
          set -euo pipefail
          brew install jq

      # Find and boot an available iPhone simulator via JSON, expose UDID
      - name: Boot iOS Simulator
        run: |
          set -euo pipefail
          echo "Available devices (JSON):"
          xcrun simctl list devices available -j | jq '.'
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[]
                      | select((.isAvailable == true) or (.availability == "(available)"))
                      | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "${UDID}" ]; then
            echo "No available iPhone simulator found in JSON output." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator UDID: ${UDID}"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
          echo "SIM_UDID=${UDID}" >> "$GITHUB_ENV"

      # Build (SPM dependencies are resolved as part of xcodebuild)
      - name: Build
        run: |
          set -euo pipefail
          make build

      # Test on the booted simulator
      - name: Test
        run: |
          set -euo pipefail
          make test SIM_UDID="${SIM_UDID}"
