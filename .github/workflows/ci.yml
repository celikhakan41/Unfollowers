name: CI

on:
  push:
  pull_request:

jobs:
  ios:
    name: iOS Build & Test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Select a recent, stable Xcode without hardcoding a path
      - name: Select Xcode
        uses: apple-actions/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Helpful for diagnostics
      - name: Show Xcode and SDKs
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks || true

      # Ensure xcbeautify is available for Makefile piping
      - name: Install xcbeautify
        run: |
          set -euo pipefail
          brew install xcbeautify

      # Find and boot an available iPhone simulator, expose UDID for Makefile
      - name: Boot iOS Simulator
        run: |
          set -euo pipefail
          echo "Available devices:" && xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16 Pro/{print $2; exit}')
          if [ -z "${UDID}" ]; then
            UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16[[:space:]]/{print $2; exit}')
          fi
          if [ -z "${UDID}" ]; then
            UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone [0-9]/{print $2; exit}')
          fi
          if [ -z "${UDID}" ]; then
            echo "No available iPhone simulator found." >&2
            exit 1
          fi
          echo "Using simulator UDID: ${UDID}"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
          echo "SIM_UDID=${UDID}" >> "$GITHUB_ENV"

      # Build (SPM dependencies are resolved as part of xcodebuild)
      - name: Build
        run: |
          set -euo pipefail
          make build

      # Test on the booted simulator
      - name: Test
        run: |
          set -euo pipefail
          make test
